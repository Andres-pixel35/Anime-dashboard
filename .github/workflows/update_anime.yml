name: Run script, update anime and commit - push changes

on:
  schedule:
    - cron: '25 8 * * *'
      timezone: 'America/Bogota'
    
jobs: 
  test_schedule:
    runs-on: ubuntu-latest

    permissions: 
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Run script main.sh 5 # 5 to update the data
        run: |
          chmod +x ./main.sh
          echo -e "\nn" | ./main.sh 5

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          today=$(date +"%Y-%m-%d")

          git add .

          if git diff --cached  --quiet; then
            git commit -m "updated $today"
            git push
          else
            echo "Tell me why why"
          fi
